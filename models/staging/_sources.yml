version: 2
sources:
  - name: raw_cornerstone
    description: "Cornerstone-style CSV exports, landed as text. One file per entity. Appointments are re-extracted on every run, so the same appointment appears many times."
    freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 72, period: hour}}
    loaded_at_field: "cast(_loaded_at as timestamptz)"
    tables:
      - name: clients
      - name: patients
      - name: appointments
        loaded_at_field: "cast(EXTRACTED_AT as timestamptz)"
      - name: invoices
      - name: invoice_items
  - name: raw_allydvm
    description: "AllyDVM-style API dumps (JSONL), landed as text. Timestamps are UTC. Appointments arrive as versions keyed by updatedAt."
    freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 72, period: hour}}
    loaded_at_field: "cast(_loaded_at as timestamptz)"
    tables:
      - name: clients
      - name: patients
      - name: appointments
      - name: invoices
      - name: invoice_lines
  - name: raw_app
    description: "Wellness-plan application database tables (Postgres), landed as text."
    freshness: {warn_after: {count: 26, period: hour}}
    loaded_at_field: "cast(_loaded_at as timestamptz)"
    tables:
      - name: members
      - name: pets
      - name: memberships
      - name: payments
      - name: clinics
      - name: clinic_pims_links
        description: "Which PIMS practice feeds which clinic, and over which dates. A clinic that switched PIMS has two rows."
